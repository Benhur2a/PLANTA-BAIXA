<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planta Baixa: Passarela do Samba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos base */
    body { margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    #drag-container {
      background-color: #f1f5f9;
      background-image: url('https://www.transparenttextures.com/patterns/blueprint.png');
      cursor: grab;
    }
    #drag-container:active { cursor: grabbing; }
    #svg-wrapper {
      position: absolute;
      transform-origin: center;
      transition: transform 0.1s ease-out;
      width: 2000px;
      height: 1200px;
      left: calc(50% - 1000px);
      top: calc(50% - 600px);
    }

    /* Estilos específicos para impressão */
    @media print {
      @page { size: landscape; margin: 5mm; }
      body, html { 
        -webkit-print-color-adjust: exact; 
        print-color-adjust: exact; 
        background: white; 
        margin: 0; 
        padding: 0;
        height: 100vh; /* Garante que o corpo tenha apenas a altura de 1 página */
        overflow: hidden; /* Evita a criação de páginas extras */
      }
      .no-print { display: none !important; }
      
      #drag-container { 
        background: white !important; 
        height: auto !important; 
        overflow: visible !important; 
        position: static !important;
        margin-top: 0 !important; /* Remove o recuo do menu */
      }
      
      #svg-wrapper {
        transform: none !important;
        width: 100% !important;
        height: 85vh !important; /* Limita a altura do SVG para caber na página junto com a legenda */
        position: relative !important;
        left: auto !important;
        top: auto !important;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      svg {
        width: 100% !important;
        height: 100% !important;
      }

      .print-legend {
        position: static !important;
        width: 100% !important;
        box-shadow: none !important;
        border: none !important;
        background: transparent !important;
        margin-top: 0 !important; /* Remove o recuo superior */
        margin-bottom: 0 !important;
        padding: 10px 0 !important;
      }
      .print-legend h3 { border: none; margin-bottom: 5px; font-size: 14px; }
      .print-legend ul { display: flex; flex-wrap: wrap; gap: 15px; font-size: 12px; }
      .print-legend li { margin-top: 0 !important; }
    }
  </style>
</head>
<body class="w-full h-screen bg-slate-50 flex flex-col">

  <script>
    // Lógica Javascript para Interatividade (Zoom e Pan)
    let scale = 0.8;
    let position = { x: 0, y: 0 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    const container = document.getElementById('drag-container');
    const wrapper = document.getElementById('svg-wrapper');

    function updateTransform() {
      wrapper.style.transform = `translate(${position.x}px, ${position.y}px) scale(${scale})`;
    }

    function handleZoomIn() {
      scale = Math.min(scale + 0.2, 3);
      updateTransform();
    }

    function handleZoomOut() {
      scale = Math.max(scale - 0.2, 0.3);
      updateTransform();
    }

    function handleReset() {
      scale = 0.8;
      position = { x: 0, y: 0 };
      updateTransform();
    }

    container.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStart.x = e.clientX - position.x;
      dragStart.y = e.clientY - position.y;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        position.x = e.clientX - dragStart.x;
        position.y = e.clientY - dragStart.y;
        updateTransform();
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Zoom com a roda (scroll) do mouse
    container.addEventListener('wheel', (e) => {
      e.preventDefault(); // Evita que a página inteira role
      const zoomSpeed = 0.1;
      
      if (e.deltaY < 0) {
        // Rolou para cima: Aproximar
        scale = Math.min(scale + zoomSpeed, 3);
      } else {
        // Rolou para baixo: Afastar
        scale = Math.max(scale - zoomSpeed, 0.3);
      }
      updateTransform();
    }, { passive: false });

    // Iniciar na posição correta
    updateTransform();
  </script>
